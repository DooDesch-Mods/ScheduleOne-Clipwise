<link rel="stylesheet" href="app.css">

<!--
  TWO CARDS, SIDE BY SIDE, AND NOTHING AROUND THEM.

  The left card is the seed page as it was: the head, the rule, the filter chips and the grid, in vanilla's own
  card grey. The right card is the same sheet of stationery, narrower, carrying the three things that had
  nowhere to live on one page - search, the effect filters, and the preview of whatever the pointer is on.

  There is no board, no clip, no spiral and no tab rail. The reference for how this sits is vanilla's own
  clipboard, not a notebook.

  The widths are NOT in the stylesheet. A surface page cannot measure its own viewport, so the mod measures
  vanilla's own card and sends the numbers with the view - see `w`, `pageW`, `pageRW` and `gap` in
  SurfacePicker.ViewJson. app.js writes them onto these boxes on the first render.
-->
<div class="spread" id="spread">

  <div class="card left" id="pageL">
    <div class="head">
      <button class="back" id="back">&lt; Back</button>
      <span class="head-title" id="title">Seed</span>
      <span class="head-count" id="count"></span>
    </div>

    <div class="rule"></div>

    <div class="chips" id="chips"></div>

    <div class="list" id="rows"></div>
  </div>

  <div class="gap" id="gap"></div>

  <!-- `shut` is the folded state the opening effect starts from - see app.js. -->
  <div class="card right shut" id="pageR">

    <!-- IN THE HEAD SLOT, so the two rules line up without a heading being invented to fill the space.
         No data-typing. It keeps the caret in this field whenever nothing else holds one, and a caret in a
         field is what stops the GAME seeing keys at all - including the Escape that closes this page. Click
         the box to type. -->
    <div class="head">
      <input class="find" id="find" placeholder="Search" maxlength="40">
    </div>

    <div class="rule"></div>

    <div class="fx" id="fx"></div>

    <div class="preview" id="preview"></div>
  </div>

</div>

<script src="app.js"></script>
